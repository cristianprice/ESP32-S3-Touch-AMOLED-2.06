<main class="app-shell">
  <header>
    <p class="eyebrow">WatchConfig</p>
    <h1>Device configuration</h1>
  </header>

  <app-tabs [tabs]="tabs" (tabChange)="activeTab.set($event)" />

  @if (activeTab() === 'files') {
    <app-file-explorer />
  } @else {
    <section class="placeholder" aria-labelledby="device-tab-title">
      <h2 id="device-tab-title">Device</h2>
      <p>Device settings will appear here.</p>
    </section>
  }
</main>
